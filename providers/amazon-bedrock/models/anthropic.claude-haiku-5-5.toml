# Sources: https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock
# https://platform.claude.com/docs/en/models/haiku-5-5/overview
# https://platform.claude.com/docs/en/about-claude/pricing#model-pricing
# Toggle: additionalModelRequestFields.thinking.type = adaptive|disabled (Converse); thinking.type (InvokeModel). Disabled accepted at high effort or below; rejected at xhigh/max.
# Effort: additionalModelRequestFields.output_config.effort (Converse); output_config.effort (InvokeModel).
# Bedrock does not support structured outputs.
base_model = "anthropic/claude-haiku-5-5"
structured_output = false
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.50
output = 2.50
cache_read = 0.05
cache_write = 0.625
