# Model ID and pricing: https://platform.claude.com/docs/en/models/haiku-5-5/overview
# Foundry catalog: https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry
# Toggle: thinking.type = adaptive|disabled (disabled accepted at high effort or below; rejected at xhigh/max)
# Effort: output_config.effort = low|medium|high|xhigh|max (default medium)
base_model = "anthropic/claude-haiku-5-5"
structured_output = true
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.50
output = 2.50
cache_read = 0.05
cache_write = 0.625

[provider]
npm = "@ai-sdk/anthropic"
api = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
